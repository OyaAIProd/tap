  <path d="M 68 180 A 30 30 0 0 1 68 228" fill="none" stroke="#6366F1" stroke-width="2.5" opacity="0.35" stroke-linecap="round"/>
  <path d="M 52 170 A 42 42 0 0 1 52 238" fill="none" stroke="#6366F1" stroke-width="2" opacity="0.15" stroke-linecap="round"/>
</svg>

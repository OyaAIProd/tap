<svg xmlns="http://www.w3.org/2000/svg" viewBox="50 90 340 360" width="512" height="512">
  <!-- Woodpecker only, transparent background, cropped to bird -->

  <!-- Body -->
  <circle cx="290" cy="275" r="80" fill="white"/>

  <!-- Head -->
  <circle cx="230" cy="210" r="58" fill="white"/>

  <!-- Neck connection -->

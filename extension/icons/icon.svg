  <polygon points="176,214 102,204 100,212 178,220" fill="#D97706"/>

  <!-- Eye -->
  <circle cx="212" cy="200" r="10" fill="#1E1B4B"/>
  <circle cx="209" cy="197" r="3.5" fill="white"/>


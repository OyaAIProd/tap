name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Deno unit tests
        run: deno test --no-check --allow-all src/test/page_test.ts src/test/executor_test.ts src/test/daemon_test.ts src/test/mcp_test.ts

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate .tap.js format
        run: node extension/test/tap-format.test.mjs
      - name: Validate protocol contract
        run: node extension/test/protocol.test.mjs
      - name: Validate architecture
        run: node extension/test/architecture.test.mjs

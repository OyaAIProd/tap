name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Compile
        run: deno compile --allow-all --target ${{ matrix.target }} --output tap src/cli.ts
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf tap-${{ matrix.target }}.tar.gz tap
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path tap.exe -DestinationPath tap-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: tap-${{ matrix.target }}
          path: tap-${{ matrix.target }}.*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Package extension
        run: cd extension && zip -r ../tap-extension.zip . -x "test/*" -x "*.test.*"
      - uses: actions/upload-artifact@v4
        with:
          name: tap-extension
          path: tap-extension.zip

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          ls -la tap-*
          gh release create ${{ github.ref_name }} \
            --title "Tap ${{ github.ref_name }}" \
            --generate-notes \
            tap-*.tar.gz \
            tap-*-pc-windows-msvc.zip \
            tap-extension.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: tar -czf webclaw-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release webclaw
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/webclaw.exe -DestinationPath webclaw-${{ matrix.target }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: webclaw-${{ matrix.target }}
          path: webclaw-${{ matrix.target }}.*

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate webclaws
        run: node extension-v2/test/webclaw-format.test.mjs
      - name: Package extension
        run: cd extension-v2 && zip -r ../webclaw-extension.zip . -x "test/*" -x "*.test.*"
      - uses: actions/upload-artifact@v4
        with:
          name: webclaw-extension
          path: webclaw-extension.zip

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: |
          gh release create ${{ github.ref_name }} \
            --title "WebClaw ${{ github.ref_name }}" \
            --generate-notes \
            webclaw-*.tar.gz \
            webclaw-*.zip \
            webclaw-extension.zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

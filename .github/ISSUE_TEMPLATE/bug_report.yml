name: Bug Report
description: Something isn't working
labels: ["bug"]
body:
  - type: input
    id: tap
    attributes:
      label: Tap or component
      description: Which tap or component is affected?
      placeholder: "e.g. bilibili/hot, forge.inspect, bridge"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug. Include error messages if any.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Tap version
      description: "Output of `tap --version`"
      placeholder: "0.3.0"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - macOS
        - Linux
        - Windows

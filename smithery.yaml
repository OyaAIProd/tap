# Smithery configuration for Tap MCP server
# https://smithery.ai/docs

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      runtime:
        type: string
        description: "Runtime to use: 'extension' (Chrome, default) or 'playwright' (headless)"
        default: "extension"
    required: []
  commandFunction: |-
    (config) => ({
      command: "tap",
      args: ["mcp"],
      env: {}
    })

[package]
name = "tap"
version = "0.2.0"
edition = "2021"
description = "Make every website programmable by AI"
license = "MIT"
repository = "https://github.com/LeonTing1010/webclaw"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
tokio-tungstenite = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
futures-util = "0.3"
base64 = "0.22"

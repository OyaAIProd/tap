[package]
name = "tap"
version = "0.3.0"
edition = "2021"
description = "Make every interface programmable by AI — universal protocol with 8 kernel primitives, 77 pre-built taps, MCP native"
license = "AGPL-3.0"
repository = "https://github.com/LeonTing1010/tap"
authors = ["Leon Ting <LeonTing1010@users.noreply.github.com>"]
keywords = ["ai", "browser-automation", "mcp", "protocol", "web"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"

[dependencies]
tokio = { version = "1.50", features = ["full"] }
tokio-tungstenite = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
futures-util = "0.3"
base64 = "0.22"
